<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Microsoft YaHei, sans-serif">
  <rect width="1000" height="520" fill="#F7F9FC"/>
  <text x="30" y="42" fill="#1F3A5F" font-size="18" font-weight="bold">查重决策流程（线框 · 全虚构）</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4A6FA5"/></marker></defs>
  <g stroke="#4A6FA5" stroke-width="1.6" marker-end="url(#arrow)" fill="none">
    <path d="M170,120 L250,120"/><path d="M450,120 L530,120"/>
    <path d="M350,175 L350,240"/><path d="M450,275 L530,275"/><path d="M740,275 L800,275"/>
  </g>
  <g fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.5">
    <rect x="30" y="94" width="140" height="52" rx="6"/>
    <rect x="250" y="94" width="200" height="52" rx="6" fill="#EAF0F8"/>
    <rect x="530" y="94" width="200" height="52" rx="6" fill="#1F3A5F"/>
    <rect x="250" y="240" width="200" height="52" rx="6" fill="#EAF0F8"/>
    <rect x="530" y="240" width="210" height="52" rx="6" fill="#FFFFFF"/>
    <rect x="800" y="240" width="170" height="52" rx="6" fill="#FFF4E6" stroke="#C8791A"/>
    <rect x="530" y="350" width="200" height="52" rx="6"/>
  </g>
  <g fill="#263445" font-size="14" text-anchor="middle">
    <text x="100" y="126">两条记录</text>
    <text x="350" y="126" fill="#1F3A5F" font-weight="bold">Q1 信用代码相同？</text>
    <text x="630" y="126" fill="#FFFFFF" font-weight="bold">确定重复 · 合并候选</text>
    <text x="350" y="272" fill="#1F3A5F" font-weight="bold">Q2 规范化同名？</text>
    <text x="635" y="272">疑似重复 · 人工复核</text>
    <text x="885" y="264" fill="#C8791A" font-weight="bold">挂起 hold</text>
    <text x="885" y="284" fill="#C8791A" font-size="12">不合并</text>
    <text x="630" y="382">不重复，各自保留</text>
  </g>
  <g font-size="12" fill="#6B7A8C">
    <text x="455" y="112">是</text><text x="330" y="200">否</text>
    <text x="455" y="268">是</text><text x="455" y="382">否</text>
  </g>
  <text x="30" y="466" fill="#6B7A8C" font-size="13">确定重复 = 统一社会信用代码相同；疑似重复 = 企业名规范化后相同（人工复核）</text>
  <text x="30" y="492" fill="#6B7A8C" font-size="13">字段未决 → 挂起不合并 · 合并后 30 天内可撤销 · 超窗需审批</text>
</svg>
